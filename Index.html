<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Arsip Tercecer Pensiun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Hide arrows for number inputs */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div id="notification" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-x-full opacity-0 max-w-sm w-full bg-white shadow-lg rounded-lg pointer-events-auto ring-1 ring-black ring-opacity-5 overflow-hidden">
        <div class="p-4">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg id="notifIcon" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div class="ml-3 w-0 flex-1 pt-0.5">
                    <p id="notifMessage" class="text-sm font-medium text-gray-900"></p>
                </div>
                <div class="ml-4 flex-shrink-0 flex">
                    <button onclick="closeNotification()" class="bg-white rounded-md inline-flex text-gray-400 hover:text-gray-500 focus:outline-none">
                        <span class="sr-only">Close</span>
                        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-2xl mx-auto relative">
        
        <!-- HALAMAN MUKA / LOGIN -->
        <div id="loginView" class="bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300">
            <div class="bg-blue-600 px-6 py-6 text-center">
                <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">PENCATATAN ARSIP TERCECER PENSIUN</h1>
                <p class="text-blue-100 mt-2 text-sm">Pilih Nama Anda Untuk Memulai</p>
            </div>
            
            <div class="p-6 md:p-8 space-y-6">
                <!-- Grid Nama Petugas (Hardcoded tanpa loading) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <button type="button" onclick="loginAs('Alfira Risty Elmagita')" class="w-full bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 text-gray-700 font-semibold py-4 px-4 rounded-xl transition-all duration-200 flex justify-center items-center shadow-sm">
                        Alfira Risty Elmagita
                    </button>
                    <button type="button" onclick="loginAs('Erika')" class="w-full bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 text-gray-700 font-semibold py-4 px-4 rounded-xl transition-all duration-200 flex justify-center items-center shadow-sm">
                        Erika
                    </button>
                    <button type="button" onclick="loginAs('Razanita Mayana Saragih')" class="w-full bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 text-gray-700 font-semibold py-4 px-4 rounded-xl transition-all duration-200 flex justify-center items-center shadow-sm text-center leading-tight">
                        Razanita Mayana Saragih
                    </button>
                    <button type="button" onclick="loginAs('Saffa Dwi Ryanto')" class="w-full bg-white border-2 border-gray-200 hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 text-gray-700 font-semibold py-4 px-4 rounded-xl transition-all duration-200 flex justify-center items-center shadow-sm">
                        Saffa Dwi Ryanto
                    </button>
                </div>

                <!-- Tombol Lihat Data di Halaman Muka -->
                <div class="pt-4 mt-6 border-t border-gray-100">
                    <button type="button" onclick="openSpreadsheet()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-lg shadow-sm border border-gray-300 transition-colors flex justify-center items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Lihat Data Tersimpan (Spreadsheet)
                    </button>
                </div>
            </div>
        </div>

        <!-- HALAMAN FORM PENGISIAN DATA -->
        <div id="formView" class="hidden bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
                <h1 class="text-lg md:text-xl font-bold text-white tracking-wide">PENCATATAN ARSIP</h1>
                <div class="bg-blue-500 px-3 py-1 rounded-full border border-blue-400 text-right">
                    <span class="text-xs text-blue-100 block leading-tight">Petugas Aktif</span>
                    <span id="activeUserDisplay" class="text-sm font-bold text-white leading-tight">...</span>
                </div>
            </div>
            
            <form id="arsipForm" class="p-6 md:p-8 space-y-6">
                
                <!-- Kolom 1: NIP -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">NIP (Nomor Induk Pegawai)</label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="jenisNip" class="w-full sm:w-1/3 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 outline-none transition-colors">
                            <option value="baru">NIP Baru (18 Digit)</option>
                            <option value="lama">NIP Lama (8 Digit)</option>
                        </select>
                        <div class="w-full sm:w-2/3 relative">
                            <input type="text" id="nip" placeholder="Contoh: 198001012010011001 (18 Digit)" maxlength="18" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors">
                            <p id="nipError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                    </div>
                </div>

                <!-- Kolom 2: Instansi -->
                <div class="space-y-2">
                    <label for="instansi" class="block text-sm font-semibold text-gray-700">Instansi</label>
                    <input type="text" id="instansi" disabled placeholder="Nama Instansi" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
                    <p id="instansiError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <!-- Kolom 3: Rollopack -->
                <div class="space-y-2">
                    <label for="rollopack" class="block text-sm font-semibold text-gray-700">Rollopack (3 Digit)</label>
                    <input type="text" id="rollopack" disabled maxlength="3" placeholder="Contoh: 001" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
                    <p id="rollopackError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <!-- Dynamic Fields: Lemari & Rak -->
                <div id="lemariRakContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="space-y-2">
                        <label for="lemari" class="block text-sm font-semibold text-gray-700">Lemari (1 Digit)</label>
                        <input type="text" id="lemari" disabled maxlength="1" placeholder="Contoh: 1" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
                        <p id="lemariError" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                    <div class="space-y-2">
                        <label for="rak" class="block text-sm font-semibold text-gray-700">Rak (1 Digit)</label>
                        <input type="text" id="rak" disabled maxlength="1" placeholder="Contoh: 2" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-colors disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
                        <p id="rakError" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="pt-4 flex flex-col sm:flex-row gap-4 items-center justify-between border-t border-gray-100">
                    <button type="button" id="btnSimpan" onclick="submitData()" disabled class="w-full sm:w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-blue-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                        </svg>
                        Simpan Data
                    </button>
                    <!-- Tombol Selesai (Kembali ke Halaman Muka) -->
                    <button type="button" onclick="logout()" class="w-full sm:w-1/2 bg-red-50 hover:bg-red-100 text-red-700 font-semibold py-3 px-4 rounded-lg shadow-sm border border-red-200 transition-colors flex justify-center items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                        </svg>
                        Selesai Sesi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for viewing mock data (Lokal/Tanpa Apps Script) -->
    <div id="mockDataModal" class="fixed inset-0 z-40 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true" onclick="closeMockSpreadsheet()"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <div class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-5xl w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:text-left w-full">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Data Arsip Tersimpan (Simulasi)</h3>
                            <div class="mt-4 overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200 border">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Timestamp</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Petugas</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Jenis NIP</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">NIP</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Instansi</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rollopack</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Lemari</th>
                                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Rak</th>
                                        </tr>
                                    </thead>
                                    <tbody id="mockDataBody" class="bg-white divide-y divide-gray-200 text-sm">
                                        <!-- Data will be injected here -->
                                    </tbody>
                                </table>
                                <p id="emptyState" class="text-center text-gray-500 mt-4 py-4 hidden">Belum ada data tersimpan.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button type="button" onclick="closeMockSpreadsheet()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Tutup
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentUser = "";
        const mockDatabase = [];

        // DOM Elements
        const loginView = document.getElementById('loginView');
        const formView = document.getElementById('formView');
        const activeUserDisplay = document.getElementById('activeUserDisplay');
        const form = document.getElementById('arsipForm');
        const nipType = document.getElementById('jenisNip');
        const nipInput = document.getElementById('nip');
        const instansiInput = document.getElementById('instansi');
        const rollopackInput = document.getElementById('rollopack');
        const lemariContainer = document.getElementById('lemariRakContainer');
        const lemariInput = document.getElementById('lemari');
        const rakInput = document.getElementById('rak');
        const btnSimpan = document.getElementById('btnSimpan');

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            validateNipStatus();
        });

        // Action: Masuk berdasarkan pilihan nama
        function loginAs(name) {
            currentUser = name;
            activeUserDisplay.textContent = currentUser;
            
            // Animasi transisi instan dari login ke form
            loginView.classList.add('hidden');
            formView.classList.remove('hidden');
            
            showNotification(`Selamat bekerja, ${currentUser}!`, 'success');
        }

        // Action: Selesai (Logout)
        function logout() {
            currentUser = "";
            activeUserDisplay.textContent = "...";
            resetForm();
            
            formView.classList.add('hidden');
            loginView.classList.remove('hidden');
        }

        function setError(id, message) {
            const el = document.getElementById(id);
            const inputEl = document.getElementById(id.replace('Error', ''));
            if (message) {
                el.innerText = message;
                el.classList.remove('hidden');
                inputEl.classList.add('border-red-500');
            } else {
                el.classList.add('hidden');
                inputEl.classList.remove('border-red-500');
            }
        }

        function validateNipStatus() {
            const type = nipType.value;
            const val = nipInput.value.replace(/[^0-9]/g, '');
            const max = type === 'baru' ? 18 : 8;
            let isValid = false;

            if (val.length > 0 && val.length < max) {
                setError('nipError', `NIP belum memenuhi ketentuan ${max} digit.`);
            } else if (val.length === max) {
                if (type === 'baru' && val.slice(-3) === '000') {
                    setError('nipError', '3 digit terakhir NIP Baru tidak boleh 000.');
                } else {
                    setError('nipError', '');
                    isValid = true;
                }
            } else if (val.length === 0) {
                setError('nipError', '');
            }

            instansiInput.disabled = !isValid;
            rollopackInput.disabled = !isValid;
            lemariInput.disabled = !isValid;
            rakInput.disabled = !isValid;
            btnSimpan.disabled = !isValid;
        }

        nipType.addEventListener('change', () => {
            nipInput.value = '';
            if (nipType.value === 'lama') {
                nipInput.placeholder = "Contoh: 12345678 (8 Digit)";
                nipInput.maxLength = 8;
            } else {
                nipInput.placeholder = "Contoh: 198001012010011001 (18 Digit)";
                nipInput.maxLength = 18;
            }
            validateNipStatus();
        });

        ['rollopack', 'lemari', 'rak'].forEach(id => {
            document.getElementById(id).addEventListener('input', function(e) {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        });

        nipInput.addEventListener('keydown', function(e) {
            const max = parseInt(this.getAttribute('maxlength') || 18);
            const type = nipType.value;
            const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
            
            if (this.value.length >= max && !allowedKeys.includes(e.key) && !e.ctrlKey && !e.metaKey) {
                if (this.selectionStart === this.selectionEnd) {
                    e.preventDefault(); 
                    if (type === 'baru' && this.value.slice(-3) === '000') {
                        setError('nipError', '3 digit terakhir NIP Baru tidak boleh 000.');
                    } else {
                        setError('nipError', `Batas maksimal ${max} digit telah tercapai.`);
                    }
                }
            }
        });

        nipInput.addEventListener('input', function(e) {
            let val = this.value.replace(/[^0-9]/g, '');
            const max = parseInt(this.getAttribute('maxlength') || 18);

            if (val.length > max) {
                val = val.substring(0, max);
            }
            this.value = val;
            validateNipStatus();
        });

        rollopackInput.addEventListener('input', (e) => {
            const val = e.target.value;
            setError('rollopackError', '');
            if (val.length === 3) {
                lemariContainer.classList.remove('hidden');
            } else {
                lemariContainer.classList.add('hidden');
                lemariInput.value = '';
                rakInput.value = '';
                setError('lemariError', '');
                setError('rakError', '');
            }
        });

        function submitData() {
            let isValid = true;
            const type = nipType.value;
            const nipVal = nipInput.value;

            if (type === 'lama' && nipVal.length !== 8) isValid = false;
            if (type === 'baru' && (nipVal.length !== 18 || nipVal.slice(-3) === '000')) isValid = false;

            const instansiVal = instansiInput.value.trim();
            if (!instansiVal) {
                setError('instansiError', 'Instansi tidak boleh kosong.');
                isValid = false;
            } else {
                setError('instansiError', '');
            }

            const rollopackVal = rollopackInput.value;
            if (rollopackVal.length !== 3) {
                setError('rollopackError', 'Rollopack harus tepat 3 digit angka.');
                isValid = false;
            } else {
                setError('rollopackError', '');
            }

            let lemariVal = '';
            let rakVal = '';
            if (!lemariContainer.classList.contains('hidden')) {
                lemariVal = lemariInput.value;
                rakVal = rakInput.value;

                if (lemariVal.length !== 1) {
                    setError('lemariError', 'Wajib 1 digit angka.');
                    isValid = false;
                } else {
                    setError('lemariError', '');
                }

                if (rakVal.length !== 1) {
                    setError('rakError', 'Wajib 1 digit angka.');
                    isValid = false;
                } else {
                    setError('rakError', '');
                }
            }

            if (isValid) {
                const data = {
                    petugas: currentUser,
                    nipType: type,
                    nip: nipVal,
                    instansi: instansiVal,
                    rollopack: rollopackVal,
                    lemari: lemariVal,
                    rak: rakVal,
                    timestamp: new Date().toLocaleString('id-ID')
                };

                btnSimpan.innerText = "Menyimpan...";
                btnSimpan.disabled = true;

                if (typeof google !== 'undefined' && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(() => {
                            showNotification('Data berhasil disimpan ke Spreadsheet!', 'success');
                            resetForm();
                            btnSimpan.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>Simpan Data`;
                        })
                        .withFailureHandler((err) => {
                            showNotification('Gagal menyimpan: ' + err, 'error');
                            btnSimpan.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>Simpan Data`;
                            btnSimpan.disabled = false;
                        })
                        .simpanDataSpreadsheet(data);
                } else {
                    mockDatabase.push(data);
                    showNotification('Data tersimpan (Mode Preview Lokal)', 'success');
                    resetForm();
                    btnSimpan.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>Simpan Data`;
                }
            }
        }

        function resetForm() {
            form.reset();
            lemariContainer.classList.add('hidden');
            ['nip', 'instansi', 'rollopack', 'lemari', 'rak'].forEach(id => {
                setError(id + 'Error', '');
            });
            nipInput.placeholder = "Contoh: 198001012010011001 (18 Digit)";
            nipInput.maxLength = 18;
            validateNipStatus(); 
        }

        function openSpreadsheet() {
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler((url) => {
                        window.open(url, '_blank');
                    })
                    .getSpreadsheetUrl();
            } else {
                renderMockTable();
                document.getElementById('mockDataModal').classList.remove('hidden');
            }
        }

        function closeMockSpreadsheet() {
            document.getElementById('mockDataModal').classList.add('hidden');
        }

        function renderMockTable() {
            const tbody = document.getElementById('mockDataBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';
            
            if (mockDatabase.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                mockDatabase.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="px-4 py-4 whitespace-nowrap">${row.timestamp}</td>
                        <td class="px-4 py-4 whitespace-nowrap font-medium text-blue-600">${row.petugas}</td>
                        <td class="px-4 py-4 whitespace-nowrap capitalize">${row.nipType}</td>
                        <td class="px-4 py-4 whitespace-nowrap">${row.nip}</td>
                        <td class="px-4 py-4 whitespace-nowrap">${row.instansi}</td>
                        <td class="px-4 py-4 whitespace-nowrap">${row.rollopack}</td>
                        <td class="px-4 py-4 whitespace-nowrap">${row.lemari}</td>
                        <td class="px-4 py-4 whitespace-nowrap">${row.rak}</td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        let notifTimeout;
        function showNotification(message, type) {
            const notif = document.getElementById('notification');
            const notifMsg = document.getElementById('notifMessage');
            const icon = document.getElementById('notifIcon');

            notifMsg.innerText = message;
            if(type === 'error') {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
                icon.classList.remove('text-green-400');
                icon.classList.add('text-red-400');
            } else {
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />';
                icon.classList.remove('text-red-400');
                icon.classList.add('text-green-400');
            }

            notif.classList.remove('translate-x-full', 'opacity-0');
            clearTimeout(notifTimeout);
            notifTimeout = setTimeout(closeNotification, 4000);
        }

        function closeNotification() {
            const notif = document.getElementById('notification');
            notif.classList.add('translate-x-full', 'opacity-0');
        }
    </script>
</body>
</html>
