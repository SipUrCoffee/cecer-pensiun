<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Arsip Tercecer Pensiun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        /* Menghilangkan panah spinner pada input angka */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen p-4 md:p-8 flex items-center justify-center">

    <!-- Notifikasi Toast -->
    <div id="notification" class="fixed top-5 right-5 z-50 transform transition-all duration-300 translate-x-full opacity-0 max-w-sm w-full bg-white shadow-lg rounded-lg pointer-events-auto ring-1 ring-black ring-opacity-5 overflow-hidden">
        <div class="p-4">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <svg id="notifIcon" class="h-6 w-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div class="ml-3 w-0 flex-1 pt-0.5">
                    <p id="notifMessage" class="text-sm font-medium text-gray-900"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="w-full max-w-2xl mx-auto relative">
        
        <!-- HALAMAN MUKA / LOGIN -->
        <div id="loginView" class="bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300 block">
            <div class="bg-blue-600 px-6 py-6 text-center">
                <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">PENCATATAN ARSIP TERCECER PENSIUN</h1>
                <p class="text-blue-100 mt-2 text-sm">Pilih Nama Anda Untuk Memulai</p>
            </div>
            
            <div class="p-6 md:p-8 space-y-6">
                
                <!-- Dropdown Pilih Nama Petugas -->
                <div class="space-y-2">
                    <label for="userDropdown" class="block text-sm font-semibold text-gray-700">Nama Petugas</label>
                    <select id="userDropdown" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 outline-none cursor-pointer">
                        <option value="" disabled selected>-- Pilih Nama Anda --</option>
                        <option value="Alfira Risty Elmagita">Alfira Risty Elmagita</option>
                        <option value="Angghi Bimantoro">Angghi Bimantoro</option>
                        <option value="Edward Sampe Sangap">Edward Sampe Sangap</option>
                        <option value="Erika">Erika</option>
                        <option value="Ifal Putra">Ifal Putra</option>
                        <option value="Razanita Mayana Saragih">Razanita Mayana Saragih</option>
                        <option value="Riyandi Darmawan Putra">Riyandi Darmawan Putra</option>
                        <option value="Saffa Dwi Ryanto">Saffa Dwi Ryanto</option>
                    </select>
                </div>

                <button type="button" id="btnMasuk" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center">
                    Masuk ke Form
                </button>

                <!-- Tombol Lihat Data di Halaman Muka -->
                <div class="pt-4 mt-6 border-t border-gray-100">
                    <button type="button" id="btnLihatData" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-3 px-4 rounded-lg shadow-sm border border-gray-300 transition-colors flex justify-center items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Lihat Data Tersimpan
                    </button>
                </div>
            </div>
        </div>

        <!-- HALAMAN FORM PENGISIAN DATA -->
        <div id="formView" class="hidden bg-white rounded-xl shadow-md overflow-hidden transition-all duration-300">
            <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
                <h1 class="text-lg md:text-xl font-bold text-white tracking-wide">FORM ARSIP</h1>
                <div class="bg-blue-500 px-3 py-1 rounded-full border border-blue-400 text-right">
                    <span class="text-xs text-blue-100 block leading-tight">Petugas Aktif</span>
                    <span id="activeUserDisplay" class="text-sm font-bold text-white leading-tight">...</span>
                </div>
            </div>
            
            <form id="arsipForm" class="p-6 md:p-8 space-y-6">
                <!-- Kolom NIP -->
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700">NIP (Nomor Induk Pegawai)</label>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <select id="jenisNip" class="w-full sm:w-1/3 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-gray-50 outline-none">
                            <option value="baru">NIP Baru (18 Digit)</option>
                            <option value="lama">NIP Lama (8 Digit)</option>
                        </select>
                        <div class="w-full sm:w-2/3 relative">
                            <input type="text" id="nip" placeholder="Contoh: 198001012010011001 (18 Digit)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                            <p id="nipError" class="text-red-500 text-xs mt-1 hidden"></p>
                        </div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="instansi" class="block text-sm font-semibold text-gray-700">Instansi</label>
                    <input type="text" id="instansi" disabled class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
                    <p id="instansiError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <div class="space-y-2">
                    <label for="rollopack" class="block text-sm font-semibold text-gray-700">Rollopack (3 Digit)</label>
                    <input type="text" id="rollopack" disabled maxlength="3" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
                    <p id="rollopackError" class="text-red-500 text-xs mt-1 hidden"></p>
                </div>

                <div id="lemariRakContainer" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4 p-4 bg-gray-50 rounded-lg border border-gray-200">
                    <div class="space-y-2">
                        <label for="lemari" class="block text-sm font-semibold text-gray-700">Lemari (1 Digit)</label>
                        <input type="text" id="lemari" disabled maxlength="1" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
                        <p id="lemariError" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                    <div class="space-y-2">
                        <label for="rak" class="block text-sm font-semibold text-gray-700">Rak (1 Digit)</label>
                        <input type="text" id="rak" disabled maxlength="1" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:cursor-not-allowed">
                        <p id="rakError" class="text-red-500 text-xs mt-1 hidden"></p>
                    </div>
                </div>

                <div class="pt-4 flex flex-col sm:flex-row gap-4 items-center justify-between border-t border-gray-100">
                    <button type="button" id="btnSimpan" disabled class="w-full sm:w-1/2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed">
                        Simpan Data
                    </button>
                    <button type="button" id="btnSelesai" class="w-full sm:w-1/2 bg-red-50 hover:bg-red-100 text-red-700 font-semibold py-3 px-4 rounded-lg shadow-sm border border-red-200 transition-colors flex justify-center items-center">
                        Selesai Sesi
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ====================================================================
        // KONFIGURASI API 
        // Isi const di bawah dengan URL Deployment Web App Apps Script Anda!
        // ====================================================================
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyX0N3--iE90TEDbEJd9vtv_lFf-CfICKXUZdAV3azVlcxNKe_PgHmtQ4FFXLF3jzuJ/exec"; 
        const SPREADSHEET_URL = "https://docs.google.com/spreadsheets/d/1ra-KL9StOcrDgoCZJHHmSWgc-S7FqkSs3MlsJUX3VXU/edit?usp=sharing";    // Opsional
        // ====================================================================

        document.addEventListener('DOMContentLoaded', () => {
            let currentUser = "";
            const form = document.getElementById('arsipForm');
            const nipType = document.getElementById('jenisNip');
            const nipInput = document.getElementById('nip');
            const instansiInput = document.getElementById('instansi');
            const rollopackInput = document.getElementById('rollopack');
            const lemariContainer = document.getElementById('lemariRakContainer');
            const lemariInput = document.getElementById('lemari');
            const rakInput = document.getElementById('rak');
            const btnSimpan = document.getElementById('btnSimpan');
            
            // Elemen Halaman Muka
            const userDropdown = document.getElementById('userDropdown');
            const btnMasuk = document.getElementById('btnMasuk');

            // --- FUNGSI LOGIN / LOGOUT ---
            btnMasuk.addEventListener('click', function() {
                if (!userDropdown.value) {
                    showNotification('Harap pilih nama Anda terlebih dahulu!', 'error');
                    return;
                }
                
                currentUser = userDropdown.value;
                document.getElementById('activeUserDisplay').textContent = currentUser;
                
                // Pindah halaman
                document.getElementById('loginView').classList.add('hidden');
                document.getElementById('formView').classList.remove('hidden');
                
                showNotification(`Selamat bekerja, ${currentUser}!`, 'success');
                validateNipStatus();
            });

            document.getElementById('btnSelesai').addEventListener('click', () => {
                currentUser = "";
                userDropdown.value = ""; // Reset pilihan dropdown
                resetForm();
                document.getElementById('formView').classList.add('hidden');
                document.getElementById('loginView').classList.remove('hidden');
            });

            document.getElementById('btnLihatData').addEventListener('click', () => {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run.withSuccessHandler(url => window.open(url, '_blank')).getSpreadsheetUrl();
                } else if (SPREADSHEET_URL !== "") {
                    window.open(SPREADSHEET_URL, '_blank');
                } else {
                    alert("Harap isi SPREADSHEET_URL di dalam kode HTML jika tidak menjalankannya dari dalam Apps Script.");
                }
            });

            // --- FUNGSI VALIDASI UI ---
            function setError(id, message) {
                const el = document.getElementById(id);
                const inputEl = document.getElementById(id.replace('Error', ''));
                if (message) {
                    el.innerText = message; el.classList.remove('hidden'); inputEl.classList.add('border-red-500');
                } else {
                    el.classList.add('hidden'); inputEl.classList.remove('border-red-500');
                }
            }

            function validateNipStatus() {
                const type = nipType.value;
                const val = nipInput.value.replace(/[^0-9]/g, '');
                const max = type === 'baru' ? 18 : 8;
                let isValid = false;

                if (val.length > 0 && val.length < max) {
                    setError('nipError', `NIP belum memenuhi ketentuan ${max} digit.`);
                } else if (val.length === max) {
                    if (type === 'baru' && val.slice(-3) === '000') {
                        setError('nipError', '3 digit terakhir NIP Baru tidak boleh 000.');
                    } else {
                        setError('nipError', ''); isValid = true;
                    }
                } else if (val.length === 0) {
                    setError('nipError', '');
                }

                instansiInput.disabled = !isValid;
                rollopackInput.disabled = !isValid;
                lemariInput.disabled = !isValid;
                rakInput.disabled = !isValid;
                btnSimpan.disabled = !isValid;
            }

            // --- EVENT LISTENER INPUT ---
            nipType.addEventListener('change', () => {
                nipInput.value = '';
                nipInput.placeholder = nipType.value === 'baru' ? "Contoh: 198001012010011001 (18 Digit)" : "Contoh: 12345678 (8 Digit)";
                validateNipStatus();
            });

            nipInput.addEventListener('keydown', function(e) {
                const max = nipType.value === 'baru' ? 18 : 8;
                const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];
                if (this.value.length >= max && !allowedKeys.includes(e.key) && !e.ctrlKey && !e.metaKey) {
                    if (this.selectionStart === this.selectionEnd) {
                        e.preventDefault(); 
                        if (nipType.value === 'baru' && this.value.slice(-3) === '000') {
                            setError('nipError', '3 digit terakhir NIP Baru tidak boleh 000.');
                        } else {
                            setError('nipError', `Batas maksimal ${max} digit telah tercapai.`);
                        }
                    }
                }
            });

            nipInput.addEventListener('input', function() {
                let val = this.value.replace(/[^0-9]/g, '');
                const max = nipType.value === 'baru' ? 18 : 8;
                if (val.length > max) val = val.substring(0, max);
                this.value = val;
                validateNipStatus();
            });

            ['rollopack', 'lemari', 'rak'].forEach(id => {
                document.getElementById(id).addEventListener('input', function() {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            });

            rollopackInput.addEventListener('input', (e) => {
                setError('rollopackError', '');
                if (e.target.value.length === 3) {
                    lemariContainer.classList.remove('hidden');
                } else {
                    lemariContainer.classList.add('hidden');
                    lemariInput.value = ''; rakInput.value = '';
                    setError('lemariError', ''); setError('rakError', '');
                }
            });

            // --- FUNGSI SIMPAN DATA KE SPREADSHEET ---
            btnSimpan.addEventListener('click', () => {
                let isValid = true;
                const type = nipType.value;
                const nipVal = nipInput.value;
                const rollopackVal = rollopackInput.value;

                if (!instansiInput.value.trim()) { setError('instansiError', 'Wajib diisi.'); isValid = false; }
                if (rollopackVal.length !== 3) { setError('rollopackError', 'Wajib 3 digit.'); isValid = false; }

                let lemariVal = '', rakVal = '';
                if (!lemariContainer.classList.contains('hidden')) {
                    lemariVal = lemariInput.value; rakVal = rakInput.value;
                    if (lemariVal.length !== 1) { setError('lemariError', 'Wajib 1 digit.'); isValid = false; }
                    if (rakVal.length !== 1) { setError('rakError', 'Wajib 1 digit.'); isValid = false; }
                }

                if (isValid) {
                    const payload = {
                        petugas: currentUser, 
                        nipType: type, 
                        nip: nipVal, 
                        instansi: instansiInput.value.trim(), 
                        rollopack: rollopackVal, 
                        lemari: lemariVal, 
                        rak: rakVal
                    };

                    btnSimpan.innerText = "Menyimpan...";
                    btnSimpan.disabled = true;

                    // Eksekusi dari dalam Apps Script (Jika berjalan di server Google)
                    if (typeof google !== 'undefined' && google.script && google.script.run) {
                        google.script.run
                            .withSuccessHandler(() => { showNotification('Berhasil disimpan!', 'success'); resetForm(); btnSimpan.innerText = "Simpan Data"; })
                            .withFailureHandler((err) => { showNotification('Gagal: ' + err, 'error'); btnSimpan.disabled = false; btnSimpan.innerText = "Simpan Data"; })
                            .simpanDataSpreadsheet(payload);
                    } 
                    // Eksekusi API External (Jika File HTML dibuka secara lokal)
                    else if (GOOGLE_WEB_APP_URL !== "") {
                        fetch(GOOGLE_WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify(payload)
                        })
                        .then(response => response.json())
                        .then(result => {
                            if(result.status === 'success') {
                                showNotification('Berhasil disimpan (Via API)!', 'success');
                                resetForm();
                            } else {
                                showNotification('Gagal: ' + result.message, 'error');
                            }
                        })
                        .catch(error => {
                            showNotification('Gagal menghubungi server.', 'error');
                            console.error(error);
                        })
                        .finally(() => {
                            btnSimpan.disabled = false;
                            btnSimpan.innerText = "Simpan Data";
                        });
                    } else {
                        alert("Tidak terhubung ke server. Harap jalankan dari Apps Script atau isi variabel GOOGLE_WEB_APP_URL.");
                        btnSimpan.disabled = false;
                        btnSimpan.innerText = "Simpan Data";
                    }
                }
            });

            function resetForm() {
                form.reset();
                lemariContainer.classList.add('hidden');
                ['nip', 'instansi', 'rollopack', 'lemari', 'rak'].forEach(id => setError(id + 'Error', ''));
                nipInput.placeholder = nipType.value === 'baru' ? "Contoh: 198001012010011001 (18 Digit)" : "Contoh: 12345678 (8 Digit)";
                validateNipStatus();
            }

            let notifTimeout;
            function showNotification(message, type) {
                const notif = document.getElementById('notification');
                document.getElementById('notifMessage').innerText = message;
                
                const icon = document.getElementById('notifIcon');
                if (type === 'error') {
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
                    icon.classList.remove('text-green-400');
                    icon.classList.add('text-red-400');
                } else {
                    icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />';
                    icon.classList.remove('text-red-400');
                    icon.classList.add('text-green-400');
                }

                notif.classList.remove('translate-x-full', 'opacity-0');
                clearTimeout(notifTimeout);
                notifTimeout = setTimeout(() => notif.classList.add('translate-x-full', 'opacity-0'), 4000);
            }
            
            // Inisialisasi Kunci Form
            validateNipStatus();
        });
    </script>
</body>
</html>
